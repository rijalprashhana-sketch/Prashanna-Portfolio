*{box-sizing:border-box}html,body{height:100%}

.ms{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:10px 18px;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(135deg,#13264a,#35214f)}

</style></head>

const ic=(n,c)=>`<svg class="i ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
let E=[],OWN=false,cur='home',editId=null,busy=false,LOADERR=false,first=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>document.querySelector(s);
const hdr=(extra)=>Object.assign({'Accept':'application/vnd.github+json'},TOKEN?{'Authorization':'Bearer '+TOKEN}:{},extra||{});
function safeUrl(u){u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes('.')?x.href:''}catch(e){return''}}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};

function nav(){const a=(k,t,i)=>`<button class="nv ${cur==k?'on':''}" onclick="go('${k}')">${ic(i)}<span>${t}</span></button>`;
q('#nav').innerHTML=a('home',OWN?'Read &amp; write':'Home','home')+'<div class="gl">Build</div>'+a('apps','Apps &amp; Websites','apps')+'<div class="gl">Writing</div>'+a('stories','Stories','book')+a('poems','Poems','feather')+'<div class="gl">ECA</div><div class="sub">'+['leo','drone','quiz','research'].map(k=>a(k,esc(SEC[k]),SI[k])).join('')+'</div><div class="gl">Learning</div>'+a('academics','Academics','cap')+a('training','Training','award')+'<div class="gl">Contact</div>'+a('chat','Chat with me','mail')}
function go(k){cur=k;editId=null;q('#sb').classList.remove('open');q('#sc').classList.remove('on');draw();const m=q('.inner');m.classList.remove('sw');void m.offsetWidth;m.classList.add('sw');q('main').scrollTop=0;scrollTo(0,0)}
function xf(){const s=q('#sec'),x=q('#xf');if(x)x.style.display=((s?s.value:cur)=='apps')?'block':'none'}
function composer(sec){if(!OWN)return'';const e=E.find(x=>x.id==editId)||{},isApp=(sec||e.sec)=='apps';
return `<div class="box"><h3>${ic(editId?'edit':'feather')}${editId?'Edit entry':'Write something'}</h3>
${sec?'':`<select id="sec" aria-label="Section" onchange="xf()">${Object.entries(SEC).map(([k,v])=>`<option value="${k}" ${e.sec==k?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
<input id="ti" aria-label="Title" placeholder="Title" value="${esc(e.title)}">
<div id="xf" style="display:${isApp?'block':'none'}"><input id="ur" type="text" inputmode="url" aria-label="Link" placeholder="Link to the live site or app (https://…)" value="${esc(e.url)}"><input id="tg" aria-label="Built with" placeholder="Built with, separated by commas (e.g. PHP, PostgreSQL, Render)" value="${esc((Array.isArray(e.tags)?e.tags:[]).join(', '))}"></div>
<textarea id="bo" aria-label="Text" placeholder="Start writing here… (for apps: what it does and who it is for)">${esc(e.body)}</textarea>
<p class="meta" style="margin:0 0 6px">Photos or videos — select several to make a swipeable set (photos are shrunk automatically; videos up to 25 MB)${editId&&mlist(e).length?' — new ones are added after the current ones':''}</p>
<input type="file" id="fi" accept="image/*,video/*" multiple>${editId&&mlist(e).length?'<label class="meta"><input type="checkbox" id="rp" style="width:auto;margin:0 6px 0 0">Remove current photos/videos</label><br>':''}<div class="acts" style="align-items:center"><button class="btn p" id="pb" onclick="pub('${sec||''}')">${ic('send')}${editId?'Save changes':'Publish'}</button>${editId?'<button class="btn" onclick="go(cur)">Cancel</button>':''}<span class="meta" id="msg"></span></div></div>`}
function mlist(e){return e.media||[]}
function fb(el){if(el.dataset.f)return;el.dataset.f=1;el.src=RAW+el.getAttribute('src')}
function media(e){const L=mlist(e);if(!L.length)return'';const one=m=>(m.t||'').startsWith('video')?`<video src="${esc(m.p)}" onerror="fb(this)" controls preload="metadata"></video>`:`<img src="${esc(m.p)}" onerror="fb(this)" alt="" loading="lazy" onclick="lb(this.src)">`;
if(L.length==1)return one(L[0]);
return `<div class="car"><div class="trk" onscroll="dots(this)">${L.map(m=>`<div class="sl">${one(m)}</div>`).join('')}</div><span class="cn">1/${L.length}</span><button class="ar l" aria-label="Previous" onclick="nx(this,-1)">‹</button><button class="ar r" aria-label="Next" onclick="nx(this,1)">›</button><div class="dots">${L.map((m,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>`}
function dots(t){const i=Math.round(t.scrollLeft/t.clientWidth),c=t.parentNode;c.querySelector('.cn').textContent=(i+1)+'/'+t.children.length;c.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k==i))}
function nx(b,d){const t=b.parentNode.querySelector('.trk');t.scrollBy({left:d*t.clientWidth,behavior:'smooth'})}
const ownAct=e=>OWN?`<button class="btn s" onclick="ed('${e.id}')">${ic('edit')}Edit</button><button class="btn s" onclick="del('${e.id}')">${ic('trash')}Delete</button>`:'';
function article(e,showSec){const dev=/[\u0900-\u097F]/.test(e.body||'');
return `<article class="box ent ${e.sec=='poems'?'poem':''} ${dev?'dev':''}"><h3>${esc(e.title||'Untitled')}</h3><div class="meta">${showSec&&SEC[e.sec]?`<span class="chip">${ic(SI[e.sec])}${esc(SEC[e.sec])}</span>`:''}<span>${esc(e.date)}</span></div>${media(e)}<div class="body">${esc(e.body)}</div>${OWN?`<div class="acts">${ownAct(e)}</div>`:''}</article>`}
function appCard(e,showSec){const u=safeUrl(e.url),host=u?hostOf(u):'',tags=(Array.isArray(e.tags)?e.tags:[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
const cover=mlist(e).length?media(e):`<div class="mock"><div class="mb"><i></i><i></i><i></i><span>${esc(host||'coming soon')}</span></div><div class="ms">${ic('apps')}<b>${esc(e.title||'Untitled')}</b></div></div>`;
return `<article class="box ent app"><div class="cover">${cover}</div><div class="ab"><div class="ah"><h3>${esc(e.title||'Untitled')}</h3>${host?`<span class="host">${esc(host)}</span>`:''}</div>${tags?`<div class="tags">${tags}</div>`:''}<div class="body">${esc(e.body)}</div><div class="meta" style="margin-top:8px">${esc(e.date)}</div><div class="acts">${u?`<a class="btn p" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('out')}Visit site</a>`:''}${ownAct(e)}</div></div></article>`}
function listE(items,showSec,grid){if(LOADERR&&!E.length)return `<p class="empty">Could not load entries. Check your connection and refresh the page.</p>`;
if(!items.length)return `<p class="empty">${cur=='apps'?(OWN?'No apps or websites yet. Use the form above to add your first one.':'Apps and websites will be listed here soon.'):'Nothing here yet.'}</p>`;
const h=items.map(e=>e.sec=='apps'?appCard(e,showSec):article(e,showSec)).join('');return grid?`<div class="agrid">${h}</div>`:h}
function drawTiles(){const el=q('#tl');if(cur!='home'){el.innerHTML='';return}
const keys=['apps','stories','poems','drone','leo','quiz','research','academics','training'];
el.innerHTML=`<div class="tiles">${keys.map((k,i)=>{const n=E.filter(e=>e.sec==k).length;return `<button class="tile ${k=='apps'?'big':''}" style="--i:${i}" onclick="go('${k}')"><span class="ib">${ic(SI[k])}</span><span class="tt"><b>${esc(SEC[k])}</b><span>${esc(BLURB[k])}</span></span><em>${n?n+(n==1?' entry':' entries'):'Nothing yet'}</em></button>`}).join('')}</div>`}
function drawList(){if(cur=='chat'){q('#lst').innerHTML='';return}drawTiles();
q('#lst').innerHTML=(cur=='home'?'<h2>Everything I\'ve written and built</h2>':'')+listE(cur=='home'?E:E.filter(e=>e.sec==cur),cur=='home',cur=='apps')}
function waveSVG(){const T=600,N=1800,f=(x,ph)=>60+26*Math.sin(2*Math.PI*3*x/T+ph)*(.55+.45*Math.sin(2*Math.PI*x/T+ph/2));
const path=(ph,a)=>{let d='';for(let x=0;x<=N;x+=4)d+=(x?'L':'M')+x+' '+(60+(f(x,ph)-60)*a).toFixed(1);return d};
return `<svg class="ws" width="${N}" height="120" viewBox="0 0 ${N} 120"><path class="w2" d="${path(1.4,.6)}"/><path class="w1" d="${path(0,1)}"/></svg>`}
function icons(){q('#bg').innerHTML=ic('menu')+'<span>Menu</span>';
const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
q('#th').innerHTML=ic(dark?'sun':'moon')+'<span>'+(dark?'Switch to light':'Switch to dark')+'</span>';
q('#ow').innerHTML=ic(OWN?'unlock':'lock')+'<span>'+(OWN?'Log out of owner mode':'Owner login')+'</span>';q('#ow').classList.toggle('live',OWN);
q('#ow2').innerHTML=ic(OWN?'unlock':'lock')+'<span>'+(OWN?'Log out':'Owner')+'</span>'}
function draw(){nav();icons();q('#role').textContent=OWN?'Owner mode — you can write & upload':'Read-only';
if(cur=='chat'){q('#head').innerHTML=`<div class="sh"><span class="ib">${ic('mail')}</span><div><h1>Chat with me</h1><p>Say hello — your message opens in your email app, addressed to me.</p></div></div>`;q('#cmp').innerHTML=`<div class="box"><input id="cn" aria-label="Your name" placeholder="Your name"><textarea id="cm" aria-label="Your message" placeholder="Your message"></textarea><button class="btn p" onclick="mail()">${ic('send')}Send email</button><p class="meta" style="margin-top:14px">Or write to <a href="mailto:rijalprashhana@gmail.com">rijalprashhana@gmail.com</a></p></div>`}
else if(cur=='home'){q('#head').innerHTML=`<section class="hero"><h1>Prashanna Rijal</h1><p class="lead">Aspiring engineer, curious learner, creator and writer from Nepal.</p><p class="sub">A place to document what I build, what I learn, what I write, and what I wonder about.</p><div class="cta"><button class="btn p" onclick="go('apps')">${ic('apps')}Apps &amp; websites</button><button class="btn" onclick="go('poems')">${ic('feather')}Read my poems</button></div><div class="wave ${first?'':'still'}" aria-hidden="true">${waveSVG()}</div></section>${OWN?`<div class="own">${ic('unlock')}<span>Owner mode is on. Write or upload below; it shows up here straight away.</span></div>`:''}`;first=false;q('#cmp').innerHTML=composer('')}
else{q('#head').innerHTML=`<div class="sh"><span class="ib">${ic(SI[cur])}</span><div><h1>${esc(SEC[cur])}</h1><p>${esc(BLURB[cur])}</p></div></div>`;q('#cmp').innerHTML=composer(cur)}
drawList()}

/* ===== GitHub storage (unchanged) ===== */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function readList(){ // returns {list, sha}
 const r=await fetch(API+DATA+'?ref='+BR+'&t='+Date.now(),{headers:hdr(),cache:'no-store'});
 if(r.status==404)return{list:[],sha:undefined};
 if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
 const j=await r.json();return{list:JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))||'[]'),sha:j.sha}}
async function putFile(path,b64c,sha,msg){
 const r=await fetch(API+path,{method:'PUT',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify({message:msg,content:b64c,branch:BR,...(sha?{sha}:{})})});
 if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const need=r.headers.get('x-accepted-github-permissions');const e=new Error((m||('GitHub '+r.status))+' [repo: '+OWNER+'/'+REPO+', branch: '+BR+(need?', needs: '+need:'')+']');e.status=r.status;throw e}return r.json()}
async function commitList(mut,msg){
 for(let i=0;i<3;i++){const{list,sha}=await readList();const nl=mut(list);
  try{await putFile(DATA,b64(JSON.stringify(nl,null,1)),sha,msg);E=nl.sort((a,b)=>(b.ts||0)-(a.ts||0));return}
  catch(e){if(e.status!=409&&e.status!=422||i==2)throw e}}}
async function loadPublic(){ // tries GitHub API, then this site's own file, then raw GitHub; null = all failed
 const tries=[()=>fetch(API+DATA+'?ref='+BR+'&t='+Date.now(),{headers:hdr({'Accept':'application/vnd.github.raw'}),cache:'no-store'}),()=>fetch(DATA+'?t='+Date.now(),{cache:'no-store'}),()=>fetch(RAW+DATA+'?t='+Date.now(),{cache:'no-store'})];
 for(const t of tries){try{const r=await t();if(r.ok){const j=await r.json();if(Array.isArray(j))return j}}catch(e){}}
 return null}
function fileB64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}
function shrink(f){return new Promise((ok)=>{if(!f.type.startsWith('image/')||/gif|svg/.test(f.type))return ok(f);const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>ok(b||f),'image/jpeg',.85);URL.revokeObjectURL(u)};i.onerror=()=>ok(f);i.src=u})}
async function upload(f){const isV=f.type.startsWith('video');if(isV&&f.size>25e6)throw new Error(f.name+' is over 25 MB');
 const blob=isV?f:await shrink(f),ext=isV?(f.name.split('.').pop()||'mp4').toLowerCase():(blob.type=='image/jpeg'?'jpg':(f.name.split('.').pop()||'png').toLowerCase());
 const path='media/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
 await putFile(path,await fileB64(blob),undefined,'Add media');return{p:path,t:isV?(f.type||'video/mp4'):(blob.type||f.type)}}

async function pub(sec){if(!OWN||busy)return;const t=q('#ti').value.trim(),b=q('#bo').value.trim(),fs=[...q('#fi').files],m=q('#msg');
if(!t&&!b&&!fs.length){alert('Write something or add a photo/video first.');return}
const s=sec||q('#sec').value;let url='',tags=[];
if(s=='apps'){const raw=q('#ur').value.trim();url=safeUrl(raw);if(raw&&!url){m.textContent=' That link does not look right. Use a full address like https://example.com';return}
 tags=q('#tg').value.split(',').map(x=>x.trim()).filter(Boolean)}
busy=true;q('#pb').disabled=true;m.textContent=' Saving…';
try{const old=E.find(x=>x.id==editId)||{},rm=q('#rp')&&q('#rp').checked;let med=rm?[]:[...mlist(old)],n=0;
 for(const f of fs){m.textContent=' Uploading '+(++n)+' of '+fs.length+'…';med.push(await upload(f))}
 m.textContent=' Publishing…';
 const ts=old.ts||Date.now(),id=editId||String(ts),d={...old,id,sec:s,title:t,body:b,media:med,date:old.date||new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),ts};
 if(s=='apps'){d.url=url;d.tags=tags}else{delete d.url;delete d.tags}
 await commitList(l=>[d,...l.filter(x=>x.id!=id)],(editId?'Edit':'Add')+' entry');
 editId=null;draw()}
catch(e){m.textContent=' Could not save: '+(e.message||'error');q('#pb').disabled=false}busy=false}
function ed(id){editId=id;draw();q('main').scrollTop=0;scrollTo(0,0)}
async function del(id){if(OWN&&confirm('Delete this entry?'))try{await commitList(l=>l.filter(x=>x.id!=id),'Delete entry');drawList()}catch(e){alert('Could not delete: '+e.message)}}
function lb(s){const l=q('#lb');l.innerHTML=`<img src="${s}" alt="">`;l.classList.add('on');l.onclick=()=>l.classList.remove('on')}
function mail(){location.href='mailto:rijalprashhana@gmail.com?subject='+encodeURIComponent('Hello from '+q('#cn').value)+'&body='+encodeURIComponent(q('#cm').value)}
/* ===== Owner login (same flow as before) ===== */
async function verify(){if(!TOKEN)return false;try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`,{headers:hdr()});if(!r.ok)return false;const j=await r.json();return !!(j.permissions&&j.permissions.push)}catch(e){return false}}
async function ownerBtn(){if(OWN){TOKEN=null;OWN=false;try{localStorage.removeItem('gh_token')}catch(e){}draw();return}
 const t=prompt('Paste your GitHub token (fine-grained, Contents: Read and write, for this repo only).\nIt is stored only in this browser.');if(!t)return;TOKEN=t.trim();
 if(await verify()){OWN=true;try{localStorage.setItem('gh_token',TOKEN)}catch(e){}draw()}else{TOKEN=null;alert('That token does not have write access to '+OWNER+'/'+REPO+'.')}}
function menu(){q('#sb').classList.toggle('open');q('#sc').classList.toggle('on')}
q('#bg').onclick=menu;q('#sc').onclick=menu;
q('#ow').onclick=ownerBtn;q('#ow2').onclick=ownerBtn;
q('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}icons()};
addEventListener('keydown',e=>{if(e.key=='Escape'){q('#lb').classList.remove('on');q('#sb').classList.remove('open');q('#sc').classList.remove('on')}});
draw();
(async()=>{const L=await loadPublic();if(L)E=L.sort((a,b)=>(b.ts||0)-(a.ts||0));else LOADERR=true;drawList();
 if(TOKEN){OWN=await verify();if(OWN){try{E=(await readList()).list.sort((a,b)=>(b.ts||0)-(a.ts||0));LOADERR=false}catch(e){}draw()}}})();
</script></body></html>
